name: Deploy Second Brain

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      import_x_token_store:
        description: "Import current OneCLI X refresh token into the encrypted Postgres token store"
        required: false
        default: false
        type: boolean

concurrency:
  group: second-brain-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24
  GO_VERSION: "1.26.5"
  SECOND_BRAIN_BASE_PATH: /second-brain
  SECOND_BRAIN_API_BASE_URL: /second-brain
  SECOND_BRAIN_GA_MEASUREMENT_ID: G-EN1K2EMJ7X

jobs:
  build:
    name: Build frontend and API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Build static frontend for /second-brain
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ env.SECOND_BRAIN_BASE_PATH }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.SECOND_BRAIN_API_BASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ env.SECOND_BRAIN_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm --prefix frontend run build

      - name: Build Linux API binaries
        run: |
          mkdir -p dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-migrate ./cmd/migrate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-refresh ./cmd/refresh
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-digest ./cmd/digest
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-newsletter-eval ./cmd/newsletter-eval
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-langfuse-prompts ./cmd/langfuse-prompts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-precompute ./cmd/precompute
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-graph-sync ./cmd/graph-sync
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-worker ./cmd/worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/second-brain-x-token-import ./cmd/x-token-import

      - name: Package deployment artifacts
        run: |
          mkdir -p artifacts
          tar -C frontend/out -czf artifacts/frontend.tgz .
          tar -C dist -czf artifacts/api.tgz second-brain-api second-brain-migrate second-brain-refresh second-brain-digest second-brain-newsletter-eval second-brain-langfuse-prompts second-brain-precompute second-brain-graph-sync second-brain-worker second-brain-x-token-import
          tar -C supabase -czf artifacts/migrations.tgz migrations

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-deploy
          path: artifacts
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://abhijitmohanty.com/second-brain/

    env:
      DEPLOY_HOST: ${{ secrets.DO_HOST }}
      DEPLOY_PORT: ${{ secrets.DO_PORT }}
      DEPLOY_USER: ${{ secrets.DO_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      ONECLI_API_KEY: ${{ secrets.ONECLI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_USER_ID: ${{ secrets.APP_USER_ID }}
      PUBLIC_OWNER_ID: ${{ secrets.PUBLIC_OWNER_ID }}
      PUBLIC_OWNER_HANDLE: ${{ secrets.PUBLIC_OWNER_HANDLE }}
      PUBLIC_OWNER_EMAIL: ${{ secrets.PUBLIC_OWNER_EMAIL }}
      OBJECT_STORAGE_BACKEND: filesystem
      OBJECT_STORAGE_ROOT: /srv/second-brain/object-storage
      OBJECT_STORAGE_BUCKET: sources
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_CACHE_ENABLED: ${{ secrets.REDIS_CACHE_ENABLED }}
      REDIS_CACHE_TTL: ${{ secrets.REDIS_CACHE_TTL }}
      REDIS_REFRESH_STATUS_TTL: ${{ secrets.REDIS_REFRESH_STATUS_TTL }}
      REDIS_ASK_ANSWER_TTL: ${{ secrets.REDIS_ASK_ANSWER_TTL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_CACHE_PURGE_ENABLED: ${{ secrets.CLOUDFLARE_CACHE_PURGE_ENABLED }}
      MEMORY_PROFILING_ENABLED: ${{ secrets.MEMORY_PROFILING_ENABLED }}
      MEMORY_PROFILE_TOKEN: ${{ secrets.MEMORY_PROFILE_TOKEN }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
      YOUTUBE_TRANSCRIPT_TEST_VIDEO_ID: ${{ secrets.YOUTUBE_TRANSCRIPT_TEST_VIDEO_ID }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_CLIENT_ID_PROD: ${{ secrets.X_CLIENT_ID_PROD }}
      X_CLIENT_SECRET_PROD: ${{ secrets.X_CLIENT_SECRET_PROD }}
      X_SESSION_SECRET: ${{ secrets.X_SESSION_SECRET }}
      X_TOKEN_ENCRYPTION_KEY: ${{ secrets.X_TOKEN_ENCRYPTION_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: second-brain-deploy
          path: artifacts

      - name: Create production env file
        run: |
          mkdir -p artifacts/runtime
          quote() {
            printf "'%s'" "$(printf '%s' "$2" | sed "s/'/'\\\\''/g")"
          }
          write_var() {
            printf '%s=' "$1" >> artifacts/runtime/second-brain.env
            quote "$1" "$2" >> artifacts/runtime/second-brain.env
            printf '\n' >> artifacts/runtime/second-brain.env
          }
          : > artifacts/runtime/second-brain.env
          write_var APP_ENV production
          write_var PORT 8090
          write_var APP_USER_ID "$APP_USER_ID"
          write_var ALLOWED_ORIGINS "https://abhijitmohanty.com,https://www.abhijitmohanty.com"
          write_var DATABASE_URL "$DATABASE_URL"
          write_var OBJECT_STORAGE_BACKEND "${OBJECT_STORAGE_BACKEND:-filesystem}"
          write_var OBJECT_STORAGE_ROOT "${OBJECT_STORAGE_ROOT:-/srv/second-brain/object-storage}"
          write_var OBJECT_STORAGE_BUCKET "${OBJECT_STORAGE_BUCKET:-sources}"
          write_var SUPABASE_URL "$SUPABASE_URL"
          write_var SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          write_var PUBLIC_OWNER_ID "${PUBLIC_OWNER_ID:-00000000-0000-0000-0000-000000000001}"
          write_var PUBLIC_OWNER_HANDLE "${PUBLIC_OWNER_HANDLE:-abhijitmohanty}"
          write_var PUBLIC_OWNER_EMAIL "$PUBLIC_OWNER_EMAIL"
          redis_url="${REDIS_URL:-redis://127.0.0.1:6379/0}"
          write_var REDIS_URL "$redis_url"
          write_var REDIS_CACHE_ENABLED "${REDIS_CACHE_ENABLED:-true}"
          write_var REDIS_CACHE_TTL "${REDIS_CACHE_TTL:-24h}"
          write_var REDIS_REFRESH_STATUS_TTL "${REDIS_REFRESH_STATUS_TTL:-24h}"
          write_var REDIS_ASK_ANSWER_TTL "${REDIS_ASK_ANSWER_TTL:-1h}"
          write_var CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          write_var CLOUDFLARE_ZONE_ID "$CLOUDFLARE_ZONE_ID"
          write_var CLOUDFLARE_CACHE_PURGE_ENABLED "${CLOUDFLARE_CACHE_PURGE_ENABLED:-true}"
          write_var MEMORY_PROFILING_ENABLED "${MEMORY_PROFILING_ENABLED:-false}"
          write_var MEMORY_PROFILE_TOKEN "$MEMORY_PROFILE_TOKEN"
          write_var ONECLI_BIN /home/deploy/.local/bin/onecli
          write_var ONECLI_GATEWAY true
          write_var ONECLI_PROJECT second-brain
          write_var ONECLI_X_ACCESS_SECRET_ID c280ee57-4e2e-47dd-b768-85b2db002ee8
          write_var ONECLI_X_REFRESH_SECRET_ID 78842398-70d0-47cc-b517-8909e26e76ff
          write_var YOUTUBE_PLAYLIST_ID "$YOUTUBE_PLAYLIST_ID"
          write_var YOUTUBE_TRANSCRIPT_TEST_VIDEO_ID "$YOUTUBE_TRANSCRIPT_TEST_VIDEO_ID"
          write_var SUPADATA_MONTHLY_REQUEST_LIMIT 100
          write_var OPENAI_TRANSLATION_MODEL gpt-4o-mini
          write_var OPENAI_SYNTHESIS_MODEL gpt-5.4-mini
          write_var OPENAI_CHAT_MODEL gpt-5.4
          write_var OPENAI_EMBEDDING_MODEL text-embedding-3-small
          write_var OPENAI_IMAGE_MODEL gpt-image-1
          write_var LANGFUSE_TRACING_ENABLED true
          write_var LANGFUSE_BASE_URL "https://jp.cloud.langfuse.com"
          write_var LANGFUSE_PROMPT_MANAGEMENT_ENABLED true
          write_var LANGFUSE_PROMPT_LABEL production
          write_var LANGFUSE_DIGEST_PROMPT_NAME "second-brain/digest-newsletter"
          write_var PUBLIC_BASE_URL "https://abhijitmohanty.com/second-brain"
          write_var EXA_API_KEY "$EXA_API_KEY"
          write_var DIGEST_TIMEZONE Asia/Singapore
          write_var DIGEST_EMAIL_TO "$DIGEST_EMAIL_TO"
          write_var DIGEST_EMAIL_FROM "${DIGEST_EMAIL_FROM:-Second Brain <digest@second-brain.local>}"
          write_var RESEND_API_KEY "$RESEND_API_KEY"
          write_var X_CLIENT_ID "${X_CLIENT_ID_PROD:-$X_CLIENT_ID}"
          write_var X_CLIENT_SECRET "${X_CLIENT_SECRET_PROD:-$X_CLIENT_SECRET}"
          write_var X_BOOKMARK_PROCESS_LIMIT 50
          write_var X_REDIRECT_URI "https://abhijitmohanty.com/second-brain/api/auth/x/callback"
          write_var X_OAUTH_SCOPES "tweet.read users.read bookmark.read offline.access"
          write_var X_SESSION_SECRET "$X_SESSION_SECRET"
          write_var X_TOKEN_ENCRYPTION_KEY "$X_TOKEN_ENCRYPTION_KEY"
          write_var X_TOKEN_REFRESH_DIRECT true
          write_var X_REQUIRE_STORED_OAUTH true
          write_var X_REAUTHORIZE_COMMAND "npm run x:oauth:prod"
          write_var X_KEYCHAIN_TOKEN_SUFFIX "_PROD"
          write_var X_TOKEN_ROTATION_PATH "/srv/second-brain/data/runtime/x-token-rotation.json"
          write_var NEO4J_URI "$NEO4J_URI"
          write_var NEO4J_USERNAME "$NEO4J_USERNAME"
          write_var NEO4J_PASSWORD "$NEO4J_PASSWORD"
          write_var NEO4J_DATABASE "${NEO4J_DATABASE:-neo4j}"
          write_var WORKER_REFRESH_INTERVAL 2h
          write_var REFRESH_TIMEOUT 90m
          write_var PROCESS_WORKER_COUNT 8
          write_var DIGEST_TIME 18:00
          write_var GRAPH_SYNC_BATCH_SIZE 50
          printf '%s' "$ONECLI_API_KEY" > artifacts/runtime/onecli-api-key
          chmod 600 artifacts/runtime/onecli-api-key

      - name: Deploy artifacts to VPS
        run: bash scripts/deploy-vps.sh

  import-x-token-store:
    name: Import X OAuth Token Store
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.import_x_token_store }}
    needs: build

    env:
      ONECLI_API_KEY: ${{ secrets.ONECLI_API_KEY }}
      ONECLI_BIN: /usr/local/bin/onecli
      ONECLI_GATEWAY: "true"
      ONECLI_PROJECT: second-brain
      ONECLI_X_ACCESS_SECRET_ID: c280ee57-4e2e-47dd-b768-85b2db002ee8
      ONECLI_X_REFRESH_SECRET_ID: 78842398-70d0-47cc-b517-8909e26e76ff
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID_PROD || secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET_PROD || secrets.X_CLIENT_SECRET }}
      X_TOKEN_ENCRYPTION_KEY: ${{ secrets.X_TOKEN_ENCRYPTION_KEY }}
      X_TOKEN_REFRESH_DIRECT: "false"
      X_REQUIRE_STORED_OAUTH: "true"
      X_EXPECTED_USERNAME: mohantyabhijit
      X_OAUTH_SCOPES: tweet.read users.read bookmark.read offline.access
      X_REAUTHORIZE_COMMAND: npm run x:oauth:prod
      SECOND_BRAIN_SKIP_KEYCHAIN: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: second-brain-deploy
          path: artifacts

      - name: Import encrypted X token store
        run: |
          set -euo pipefail
          curl -fsSL https://onecli.sh/cli/install | sh
          "$ONECLI_BIN" auth login --api-key "$ONECLI_API_KEY" >/dev/null
          mkdir -p artifacts/api
          tar -xzf artifacts/api.tgz -C artifacts/api second-brain-x-token-import
          chmod +x artifacts/api/second-brain-x-token-import
          "$ONECLI_BIN" run --project "$ONECLI_PROJECT" -- artifacts/api/second-brain-x-token-import
