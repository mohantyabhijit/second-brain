name: Production Audit

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Verify production runtime
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_HOST: ${{ secrets.DO_HOST }}
      DEPLOY_PORT: ${{ secrets.DO_PORT }}
      DEPLOY_USER: ${{ secrets.DO_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DO_SSH_KEY }}

    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/second-brain-audit"
          chmod 600 "$HOME/.ssh/second-brain-audit"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Check public API snapshot
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl -fsS https://abhijitmohanty.com/second-brain/api/knowledge-runs/latest > latest.json
            jq -r --arg attempt "$attempt" '
              .latest as $latest
              | {
                  attempt: $attempt,
                  generatedAt: $latest.generatedAt,
                  xBookmarks: ($latest.xBookmarks | length),
                  youtube: (($latest.youtubeItems // $latest.youtube // []) | length),
                  summaries: ($latest.summaries | length),
                  insights: ($latest.insights | length),
                  digestStatus: $latest.digest.status,
                  digestScheduledFor: $latest.digest.scheduledFor,
                  blockers: ($latest.blockers | length)
                }
            ' latest.json
            if jq -e '
              .latest
              | (.xBookmarks | length) > 0
              and ((.youtubeItems // .youtube // []) | length) > 0
              and (.summaries | length) > 0
              and (.insights | length) > 0
              and (.digest.status == "sent")
              and ((.blockers | length) == 0)
            ' latest.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production API did not reach a sent digest state in time." >&2
          exit 1

      - name: Check rcron worker and recent cycle logs
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/second-brain-audit" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "== unit activity =="
          systemctl is-active second-brain-api.service
          systemctl is-active second-brain-worker.service
          echo
          echo "== worker properties =="
          systemctl show second-brain-worker.service \
            -p ActiveState \
            -p SubState \
            -p Result \
            -p ExecMainStatus \
            -p ExecMainStartTimestamp
          echo
          echo "== recent worker logs =="
          journalctl -u second-brain-worker.service -n 220 --no-pager
          REMOTE
