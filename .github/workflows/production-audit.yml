name: Production Audit

on:
  workflow_dispatch:
    inputs:
      run_digest:
        description: Run the deployed production digest binary before auditing
        required: false
        default: false
        type: boolean
      run_newsletter_eval:
        description: Run one non-mutating managed-prompt newsletter eval baseline before auditing
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Verify production runtime
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    env:
      DEPLOY_HOST: ${{ secrets.DO_HOST }}
      DEPLOY_PORT: ${{ secrets.DO_PORT }}
      DEPLOY_USER: ${{ secrets.DO_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DO_SSH_KEY }}

    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/second-brain-audit"
          chmod 600 "$HOME/.ssh/second-brain-audit"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Run production digest
        if: ${{ inputs.run_digest }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/second-brain-audit" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          api_dir="/srv/second-brain/api"
          onecli="/home/deploy/.local/bin/onecli"
          set -a
          # shellcheck disable=SC1091
          . "$api_dir/second-brain.env"
          set +a
          "$onecli" run --project second-brain -- "$api_dir/second-brain-digest"
          REMOTE

      - name: Run production newsletter eval baseline
        if: ${{ inputs.run_newsletter_eval }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/second-brain-audit" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          api_dir="/srv/second-brain/api"
          onecli="/home/deploy/.local/bin/onecli"
          set -a
          # shellcheck disable=SC1091
          . "$api_dir/second-brain.env"
          set +a
          "$onecli" run --project second-brain -- "$api_dir/second-brain-newsletter-eval" \
            --iterations 0 \
            --out "$api_dir/newsletter-experiments" \
            --timeout 5m
          REMOTE

      - name: Check public API snapshot
        run: |
          set -euo pipefail
          expected_digest_date="$(TZ=Asia/Singapore date +%Y-%m-%d)"
          if [[ "$(TZ=Asia/Singapore date +%H%M)" < "1800" ]]; then
            expected_digest_date="$(TZ=Asia/Singapore date -d 'yesterday' +%Y-%m-%d)"
          fi
          expected_digest_epoch="$(TZ=Asia/Singapore date -d "$expected_digest_date 18:00" +%s)"
          expected_scheduled_for="$(date -u -d "@$expected_digest_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in $(seq 1 30); do
            curl -fsS https://abhijitmohanty.com/second-brain/api/knowledge-runs/latest > latest.json
            jq -r --arg attempt "$attempt" --arg expectedDigestDate "$expected_digest_date" --arg expectedScheduledFor "$expected_scheduled_for" '
              .latest as $latest
              | {
                  attempt: $attempt,
                  expectedDigestDate: $expectedDigestDate,
                  expectedScheduledFor: $expectedScheduledFor,
                  generatedAt: $latest.generatedAt,
                  xBookmarks: ($latest.xBookmarks | length),
                  youtube: (($latest.youtubeItems // $latest.youtube // []) | length),
                  summaries: ($latest.summaries | length),
                  insights: ($latest.insights | length),
                  digestDate: $latest.digest.digestDate,
                  digestStatus: $latest.digest.status,
                  digestScheduledFor: $latest.digest.scheduledFor,
                  blockers: ($latest.blockers | length)
                }
            ' latest.json
            if jq -e --arg expectedDigestDate "$expected_digest_date" --arg expectedScheduledFor "$expected_scheduled_for" '
              .latest
              | (.xBookmarks | length) > 0
              and ((.youtubeItems // .youtube // []) | length) > 0
              and (.summaries | length) > 0
              and (.insights | length) > 0
              and (.digest.status == "sent")
              and (.digest.digestDate == $expectedDigestDate)
              and (.digest.scheduledFor == $expectedScheduledFor)
              and ((.blockers | length) == 0)
            ' latest.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production API did not reach a sent digest state in time." >&2
          exit 1

      - name: Check rcron worker and recent cycle logs
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/second-brain-audit" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "== unit activity =="
          systemctl is-active second-brain-api.service
          systemctl is-active second-brain-worker.service
          echo
          echo "== worker properties =="
          systemctl show second-brain-worker.service \
            -p ActiveState \
            -p SubState \
            -p Result \
            -p ExecMainStatus \
            -p ExecMainStartTimestamp
          echo
          echo "== recent worker logs =="
          journalctl -u second-brain-worker.service -n 220 --no-pager
          REMOTE
