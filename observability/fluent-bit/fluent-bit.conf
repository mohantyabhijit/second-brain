[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path  /fluent-bit/state

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Docker_Mode       On
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        zerolog_json
    Reserve_Data  On
    Preserve_Key  Off

[FILTER]
    Name   grep
    Match  docker.*
    Regex  service_name ^.+$

[FILTER]
    Name       modify
    Match      docker.*
    Hard_copy  service_name  loki_service
    Hard_copy  environment   loki_environment
    Hard_copy  log_level     loki_log_level

[OUTPUT]
    Name            loki
    Match           docker.*
    Host            loki
    Port            3100
    Labels          job=second-brain,app=second-brain,container=app,service=$loki_service,environment=$loki_environment
    Label_Map_Path  /fluent-bit/etc/loki-labels.json
    Line_Format     json
    Remove_Keys     stream,time,loki_service,loki_environment,loki_log_level
    Retry_Limit     False
