server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_observability_logs]
        regex: "true"
        action: keep
      - target_label: job
        replacement: second-brain
      - source_labels: [__meta_docker_container_label_observability_app]
        target_label: app
      - source_labels: [__meta_docker_container_label_observability_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_observability_environment]
        target_label: environment
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            timestamp: timestamp
            log_level: log_level
            service_name: service_name
            environment: environment
            request_id: request_id
            trace_id: trace_id
            user_id: user_id
            message: message
            error: error
            method: method
            route: route
            path: path
            status: status
            latency: latency
            latency_ms: latency_ms
      - labels:
          log_level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
